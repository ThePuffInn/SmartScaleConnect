name: Run SmartScaleConnect Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create configuration file
        run: |
          cat <<EOF > scaleconnect.yaml
          tanita:
            username: "${{ secrets.TANITA_USERNAME }}"
            password: "${{ secrets.TANITA_PASSWORD }}"
          garmin:
            username: "${{ secrets.GARMIN_USERNAME }}"
            password: "${{ secrets.GARMIN_PASSWORD }}"
          sync:
            - source: tanita
              destination: garmin
          EOF

      - name: Run SmartScaleConnect
        run: |
          docker run --rm \
            -v $(pwd)/scaleconnect.yaml:/app/scaleconnect.yaml \
            ghcr.io/alexxit/smartscaleconnect:latest
