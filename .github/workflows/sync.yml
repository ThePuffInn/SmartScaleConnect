name: Run SmartScaleConnect Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download SmartScaleConnect Binary
        run: |
          # Fetch the latest Linux binary version from the developer releases
          curl -s https://github.com \
          | grep "browser_download_url.*linux_amd64" \
          | cut -d : -f 2,3 \
          | tr -d \" \
          | wget -qi -
          
          # Rename and grant execution rights to the program
          mv SmartScaleConnect_linux_amd64 smartscaleconnect
          chmod +x smartscaleconnect

      - name: Create Configuration File
        run: |
          cat <<EOF > scaleconnect.yaml
          tanita:
            username: "${{ secrets.TANITA_USERNAME }}"
            password: "${{ secrets.TANITA_PASSWORD }}"
          garmin:
            username: "${{ secrets.GARMIN_USERNAME }}"
            password: "${{ secrets.GARMIN_PASSWORD }}"
          sync:
            - source: tanita
              destination: garmin
          EOF

      - name: Run Native Sync
        run: |
          ./smartscaleconnect
