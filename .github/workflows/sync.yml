name: Run SmartScaleConnect Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compile and Run Sync Engine
        run: |
          # Build the raw code into an executable application
          go build -o scaleconnect .
          
          # Run the engine directly using raw inline config structure
          ./scaleconnect -c '
          tanita:
            username: "${{ secrets.TANITA_USERNAME }}"
            password: "${{ secrets.TANITA_PASSWORD }}"
          garmin:
            username: "${{ secrets.GARMIN_USERNAME }}"
            password: "${{ secrets.GARMIN_PASSWORD }}"
          sync:
            - source: tanita
              destination: garmin
          '
