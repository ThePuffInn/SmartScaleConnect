name: Run SmartScaleConnect Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Direct Python Sync
        run: |
          python main.py \
            --tanita-user "${{ secrets.TANITA_USERNAME }}" \
            --tanita-pass "${{ secrets.TANITA_PASSWORD }}" \
            --garmin-user "${{ secrets.GARMIN_USERNAME }}" \
            --garmin-pass "${{ secrets.GARMIN_PASSWORD }}" \
            --source tanita \
            --destination garmin
