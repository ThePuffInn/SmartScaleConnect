name: Run SmartScaleConnect Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compile and Run Sync Engine
        run: |
          # 1. Build the executable
          go build -o scaleconnect .
          
          # 2. Revert to standard tanita type but target the first profile slot explicitly
          cat <<EOF > scaleconnect.yaml
          sync_tanita_to_garmin:
            from: tanita ${{ secrets.TANITA_USERNAME }} ${{ secrets.TANITA_PASSWORD }}#0
            to: garmin ${{ secrets.GARMIN_USERNAME }} ${{ secrets.GARMIN_PASSWORD }}
          EOF
          
          # 3. Run the engine
          ./scaleconnect
