name: Run SmartScaleConnect Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Required Packages
        run: |
          pip install requests pyyaml

      - name: Run Direct Python Sync
        run: |
          python main.py -c '
          sync_task:
            tanita:
              username: "${{ secrets.TANITA_USERNAME }}"
              password: "${{ secrets.TANITA_PASSWORD }}"
            garmin:
              username: "${{ secrets.GARMIN_USERNAME }}"
              password: "${{ secrets.GARMIN_PASSWORD }}"
            sync:
              - source: tanita
                destination: garmin
          '
