name: Run SmartScaleConnect Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compile and Run Sync Engine
        run: |
          # 1. Build the executable
          go build -o scaleconnect .
          
          # 2. Write the credentials to a physical configuration file
          cat <<EOF > config.yaml
          tanita:
            username: "${{ secrets.TANITA_USERNAME }}"
            password: "${{ secrets.TANITA_PASSWORD }}"
          garmin:
            username: "${{ secrets.GARMIN_USERNAME }}"
            password: "${{ secrets.GARMIN_PASSWORD }}"
          sync:
            - source: tanita
              destination: garmin
          EOF
          
          # 3. Run the engine by pointing it to the file path
          ./scaleconnect -c config.yaml
