name: Run SmartScaleConnect Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Direct Python Sync
        env:
          TANITA_USERNAME: "${{ secrets.TANITA_USERNAME }}"
          TANITA_PASSWORD: "${{ secrets.TANITA_PASSWORD }}"
          GARMIN_USERNAME: "${{ secrets.GARMIN_USERNAME }}"
          GARMIN_PASSWORD: "${{ secrets.GARMIN_PASSWORD }}"
        run: |
          python main.py --source tanita --destination garmin
