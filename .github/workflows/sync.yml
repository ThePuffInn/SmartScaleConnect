name: Run SmartScaleConnect Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compile and Run Sync Engine
        env:
          TANITA_USER: ${{ secrets.TANITA_USERNAME }}
          TANITA_PASS: ${{ secrets.TANITA_PASSWORD }}
          GARMIN_USER: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASS: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          # 1. Build the executable
          go build -o scaleconnect .
          
          # 2. Write credentials into a perfectly flat format structure
          # If your app account is registered in Europe, change 'tanita:us' to 'tanita:eu' below.
          cat << 'EOF' > scaleconnect.yaml
          sync_tanita_to_garmin:
            from: tanita:eu $TANITA_USER $TANITA_PASS
            to: garmin $GARMIN_USER $GARMIN_PASS
          EOF
          
          # 3. Use 'envsubst' to safely pass variables
          envsubst < scaleconnect.yaml > config_final.yaml
          
          # 4. Run the engine
          ./scaleconnect -c config_final.yaml
