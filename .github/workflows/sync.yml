name: Run SmartScaleConnect Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compile and Run Sync Engine
        env:
          TANITA_USER: ${{ secrets.TANITA_USERNAME }}
          TANITA_PASS: ${{ secrets.TANITA_PASSWORD }}
          GARMIN_USER: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASS: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          # 1. Build the executable
          go build -o scaleconnect .
          
          # 2. Safely generate a multi-line structured configuration file
          cat << 'EOF' > scaleconnect.yaml
          sync_tanita_to_garmin:
            from:
              type: tanita
              username: "$TANITA_USER"
              password: "$TANITA_PASS"
              region: us
            to:
              type: garmin
              username: "$GARMIN_USER"
              password: "$GARMIN_PASS"
          EOF
          
          # 3. Use 'envsubst' to inject variables safely
          envsubst < scaleconnect.yaml > config_final.yaml
          
          # 4. Run the engine
          ./scaleconnect -c config_final.yaml
